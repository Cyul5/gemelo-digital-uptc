<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemelo Digital Sede Central Tunja - Edificio 30 Hunza</title>
    <!-- Import Maps para Three.js y addons oficiales -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --bg-main: #0a1120;
            --bg-panel: #1e293b;
            --accent: #00b4d8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER */
        header { height: 60px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .header-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .header-title span { color: var(--accent); font-size: 12px; background: rgba(0,180,216,0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--accent); }
        
        /* CONTENEDOR PRINCIPAL */
        .main-container { display: flex; flex: 1; height: calc(100vh - 60px); position: relative; }
        
        /* ÁREA 3D */
        #vista-3d { flex: 1; height: 100%; position: relative; display: block; }
        #vista-3d.activa { display: block; }
        #ifc-canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* PANEL DERECHO */
        .sidebar-right { width: 320px; background-color: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; overflow-y: auto; z-index: 10; }
        .panel-section { margin-bottom: 20px; }
        .panel-section h3 { font-size: 14px; color: var(--accent); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* ESTADO Y BOTONES DE NIVELES */
        #ifc-status { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .loading-spinner { width: 14px; height: 14px; border: 2px solid var(--text-muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-nivel { width: 100%; background: #0f172a; color: var(--text-main); border: 1px solid var(--border); padding: 8px 12px; text-align: left; border-radius: 6px; cursor: pointer; margin-bottom: 6px; font-size: 13px; transition: all 0.2s; }
        .btn-nivel:hover { background: #1e293b; border-color: var(--accent); }
        .btn-nivel.active { background: rgba(0,180,216,0.2); border-color: var(--accent); color: var(--accent); font-weight: 600; }
        
        /* INFO EDIFICIO */
        .info-card { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; line-height: 1.6; }
        .info-card p span { color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            UPTC SIG <span>Gemelo Digital Sede Central Tunja</span> Edificio 30 Hunza (Sección 3D BIM)
        </div>
    </header>

    <div class="main-container">
        <!-- VISOR 3D -->
        <div id="vista-3d" class="activa">
            <div id="ifc-canvas-container"></div>
        </div>

        <!-- PANEL LATERAL -->
        <div class="sidebar-right">
            <div class="panel-section">
                <h3>Corte de Niveles (BIM)</h3>
                <div id="ifc-status"><span class="loading-spinner"></span> Inicializando visor...</div>
                <div id="ifc-layers-list">
                    <!-- Los botones se generan dinámicamente -->
                </div>
            </div>

            <div class="panel-section">
                <h3>Datos del Edificio</h3>
                <div class="info-card">
                    <p><strong>Edificio:</strong> Edificio 30 - Aulas Hunza</p>
                    <p><strong>Código:</strong> 30</p>
                    <p><strong>Sede:</strong> UPTC - Sede Central Tunja</p>
                    <p><strong>Uso Principal:</strong> Aulas de Clase y Laboratorios</p>
                    <p><strong>Nº Pisos:</strong> 5</p>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT THREE.JS: AISLAMIENTO DE PISO INDIVIDUAL (DOBLE PLANO DE CORTE) -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        let scene, camera, renderer, controls;
        let gltfLoader = null;
        let is3DInitialized = false;
        let yaCargado = false;
        let animFrameId = null;
        let needsRender = true;
        let modeloGlobal = null;
        let planoInferior = null;
        let planoSuperior = null;
        let alturaMinModel = 0, alturaMaxModel = 100;

        const URL_GLB = 'EDIFICIO_AULAS_M3D.glb';

        function init3DViewer() {
            if (is3DInitialized) return true;

            const container = document.getElementById('ifc-canvas-container');
            if (!container || container.clientWidth === 0 || container.clientHeight === 0) return false;

            const width = container.clientWidth;
            const height = container.clientHeight;

            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1120);

            camera = new THREE.PerspectiveCamera(45, width / height, 0.5, 2000);

            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                powerPreference: "high-performance" 
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            
            renderer.localClippingEnabled = true;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.addEventListener('change', () => { needsRender = true; });

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight1.position.set(100, 200, 100);
            scene.add(dirLight1);

            const gridHelper = new THREE.GridHelper(300, 60, 0x00b4d8, 0x1e293b);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            window.addEventListener('resize', () => {
                if (container && container.clientWidth > 0) {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.0));
                    needsRender = true;
                }
            });

            function animate() {
                animFrameId = requestAnimationFrame(animate);
                const isMoving = controls.update();
                if (isMoving || needsRender) {
                    renderer.render(scene, camera);
                    needsRender = false;
                }
            }

            if (animFrameId) cancelAnimationFrame(animFrameId);
            animate();

            gltfLoader = new GLTFLoader();
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
            gltfLoader.setDRACOLoader(dracoLoader);

            is3DInitialized = true;
            return true;
        }

        function aislarRangoAltura(alturaInferior, alturaSuperior) {
            if (!planoInferior || !planoSuperior) return;
            planoInferior.constant = -alturaInferior;
            planoSuperior.constant = alturaSuperior;
            needsRender = true;
        }

        function cargarModeloGLBReal() {
            if (yaCargado) return;

            const statusEl = document.getElementById('ifc-status');
            const layersEl = document.getElementById('ifc-layers-list');
            if (!init3DViewer()) return;

            statusEl.innerHTML = '<span class="loading-spinner"></span> Cargando modelo 3D...';

            gltfLoader.load(
                URL_GLB,
                (gltf) => {
                    modeloGlobal = gltf.scene;
                    modeloGlobal.updateMatrixWorld(true);

                    const boxTemp = new THREE.Box3().setFromObject(modeloGlobal);
                    const minY = boxTemp.min.y;
                    const center = boxTemp.getCenter(new THREE.Vector3());

                    modeloGlobal.position.x -= center.x;
                    modeloGlobal.position.z -= center.z;
                    modeloGlobal.position.y -= minY; 

                    modeloGlobal.updateMatrixWorld(true);

                    const boxGlobal = new THREE.Box3().setFromObject(modeloGlobal);
                    alturaMinModel = boxGlobal.min.y;
                    alturaMaxModel = boxGlobal.max.y;
                    const alturaTotal = alturaMaxModel - alturaMinModel;

                    planoInferior = new THREE.Plane(new THREE.Vector3(0, 1, 0), -alturaMinModel - 10);
                    planoSuperior = new THREE.Plane(new THREE.Vector3(0, -1, 0), alturaMaxModel + 50);
                    const arrayPlanosCorte = [planoInferior, planoSuperior];

                    modeloGlobal.traverse((child) => {
                        if (child.isMesh) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(mat => {
                                    mat.clippingPlanes = arrayPlanosCorte;
                                    mat.clipShadows = true;
                                    mat.side = THREE.DoubleSide;
                                    mat.shadowSide = THREE.DoubleSide;
                                    mat.needsUpdate = true;
                                });
                            } else if (child.material) {
                                child.material.clippingPlanes = arrayPlanosCorte;
                                child.material.clipShadows = true;
                                child.material.side = THREE.DoubleSide;
                                child.material.shadowSide = THREE.DoubleSide;
                                child.material.needsUpdate = true;
                            }
                        }
                    });

                    scene.add(modeloGlobal);

                    layersEl.innerHTML = '';
                    
                    const divControles = document.createElement('div');
                    divControles.innerHTML = `
                        <button class="btn-nivel active" data-tipo="max">Ver Edificio Completo</button>
                        <hr style="border-color:#334155; margin:8px 0;">
                        <p style="margin:4px 0; color:#94a3b8; font-size:11px;">Aislar Piso Individual:</p>
                        <div id="botones-pisos-container"></div>
                    `;
                    layersEl.appendChild(divControles);

                    const containerPisos = divControles.querySelector('#botones-pisos-container');
                    const pasoPiso = alturaTotal / 5;
                    const nombresPisos = ["Piso 1", "Piso 2", "Piso 3", "Piso 4", "Piso 5 / Cubierta"];

                    nombresPisos.forEach((nombre, idx) => {
                        const basePiso = alturaMinModel + (idx * pasoPiso);
                        const techoPiso = alturaMinModel + ((idx + 1) * pasoPiso);

                        const btn = document.createElement('button');
                        btn.className = 'btn-nivel';
                        btn.innerText = `🏢 ${nombre}`;
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('.btn-nivel').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            aislarRangoAltura(basePiso, techoPiso);
                        });
                        containerPisos.appendChild(btn);
                    });

                    divControles.querySelector('[data-tipo="max"]').addEventListener('click', function() {
                        document.querySelectorAll('.btn-nivel').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        aislarRangoAltura(alturaMinModel - 10, alturaMaxModel + 50);
                    });

                    if (!boxGlobal.isEmpty()) {
                        const newCenter = boxGlobal.getCenter(new THREE.Vector3());
                        const sizeWorld = boxGlobal.getSize(new THREE.Vector3());

                        controls.target.copy(newCenter);
                        const maxDim = Math.max(sizeWorld.x, sizeWorld.y, sizeWorld.z);
                        camera.position.set(newCenter.x + maxDim * 1.2, newCenter.y + maxDim * 0.8, newCenter.z + maxDim * 1.2);
                        camera.updateProjectionMatrix();
                        controls.update();
                    }

                    needsRender = true;
                    statusEl.innerText = '🟢 Visor 3D Listo (Aislamiento por Piso)';
                    yaCargado = true;
                },
                (xhr) => {
                    if (xhr.lengthComputable && xhr.total > 0) {
                        const pct = Math.round((xhr.loaded / xhr.total) * 100);
                        statusEl.innerHTML = `<span class="loading-spinner"></span> Cargando: ${pct}%`;
                    }
                },
                (error) => {
                    console.error('❌ Error al cargar GLB:', error);
                    statusEl.innerText = '❌ Error al cargar modelo GLB';
                }
            );
        }

        const container = document.getElementById('ifc-canvas-container');
        if (container) {
            const observer = new ResizeObserver(() => {
                if (container.clientWidth > 0 && container.clientHeight > 0) {
                    if (!is3DInitialized) init3DViewer();
                    if (document.getElementById('vista-3d').classList.contains('activa')) {
                        cargarModeloGLBReal();
                    }
                }
            });
            observer.observe(container);
        }

        window.cargarModeloIFC = cargarModeloGLBReal;
    </script>
</body>
</html>

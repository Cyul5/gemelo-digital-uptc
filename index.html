<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemelo Digital UPTC - Visor IFC</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Encabezado */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-secundario {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secundario:hover {
            background-color: #475569;
        }

        .btn-secundario.btn-activo {
            background-color: #0284c7;
            font-weight: bold;
        }

        /* Contenedor Principal */
        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Vistas */
        .vista {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .vista.activa {
            display: flex;
        }

        /* Panel Lateral (Sidebar) */
        .sidebar {
            width: 300px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .panel-card {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        /* Visor 3D */
        #ifc-canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #1a1a2e;
        }

        /* Overlays de estado */
        .overlay-status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            color: #fff;
            z-index: 5;
            display: none;
            max-width: 300px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Vista Marcador de Posición */
        .vista-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            font-size: 1.1rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <header>
        <div class="title">🏛️ Gemelo Digital UPTC - Edificio 30 Aulas</div>
        <div class="nav-buttons">
            <button id="btn-campus" class="btn-secundario btn-activo" onclick="irAVista('vista-campus')">Campus</button>
            <button id="btn-3d" class="btn-secundario" onclick="irAVista('vista-3d')">Visor 3D IFC</button>
            <button id="btn-2d" class="btn-secundario" onclick="irAVista('vista-2d')">Planos 2D</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <div class="main-container">

        <!-- VISTA CAMPUS -->
        <div id="vista-campus" class="vista activa">
            <div class="vista-placeholder">
                <div style="text-align: center;">
                    <h2>Vista General del Campus UPTC</h2>
                    <p style="margin-top: 10px;">Selecciona el <b>Edificio 30 Aulas Hunza</b> para explorar el modelo 3D IFC.</p>
                    <button class="btn-secundario btn-activo" style="margin-top: 15px;" onclick="cargarEdificio30()">Abrir Edificio 30 Aulas (3D)</button>
                </div>
            </div>
        </div>

        <!-- VISTA 3D IFC -->
        <div id="vista-3d" class="vista">
            <!-- Sidebar Panel -->
            <div class="sidebar">
                <h3>Información del Modelo</h3>
                <div class="panel-card" id="ifc-info">
                    <p><b>Estado:</b> <span id="ifc-status">Pendiente</span></p>
                    <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Edificio 30 Aulas Hunza (UPTC)</p>
                </div>
                <button class="btn-secundario btn-activo" onclick="window.reencuadrarCamara()">Encuadrar Modelo</button>
            </div>

            <!-- Contenedor del Lienzo Three.js -->
            <div id="ifc-canvas-container">
                <!-- Overlay de Carga -->
                <div id="ifc-loading-box" class="overlay-status">
                    <div class="spinner"></div>
                    <span id="loading-text">Cargando modelo IFC...</span>
                </div>

                <!-- Overlay de Error -->
                <div id="ifc-error-box" class="overlay-status" style="border-color: #ef4444; color: #fca5a5;"></div>
            </div>
        </div>

        <!-- VISTA 2D -->
        <div id="vista-2d" class="vista">
            <div class="vista-placeholder">
                <p>Planos 2D / Esquemas en desarrollo.</p>
            </div>
        </div>

    </div>

    <!-- Módulo JS: Three.js + Web-IFC -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { IFCLoader } from 'https://cdn.jsdelivr.net/npm/web-ifc-three@0.0.126/IFCLoader.js';

        /* =========================================================
           CONFIGURACIÓN Y VARIABLES GLOBALES
           ========================================================= */
        const URL_IFC = 'https://raw.githubusercontent.com/Cyul5/gemelo-digital-uptc/main/001-PRO-F2STUDIO-M3D-ARQ-001.ifc';
        const URL_WASM = 'https://cdn.jsdelivr.net/npm/web-ifc@0.0.36/';

        let scene, camera, renderer, controls, ifcLoader, currentModel;
        let is3DInitialized = false;
        let modelLoaded = false;

        /* =========================================================
           NAVEGACIÓN ENTRE PESTAÑAS
           ========================================================= */
        window.irAVista = function(vistaId) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
            document.querySelectorAll('.btn-secundario').forEach(b => b.classList.remove('btn-activo'));

            const vistaTarget = document.getElementById(vistaId);
            if (vistaTarget) vistaTarget.classList.add('activa');

            if (vistaId === 'vista-campus') document.getElementById('btn-campus')?.classList.add('btn-activo');
            if (vistaId === 'vista-3d') document.getElementById('btn-3d')?.classList.add('btn-activo');
            if (vistaId === 'vista-2d') document.getElementById('btn-2d')?.classList.add('btn-activo');

            if (vistaId === 'vista-3d') {
                setTimeout(() => {
                    if (!is3DInitialized) {
                        init3DViewer();
                    } else {
                        ajustarTamanoRenderer();
                    }
                    if (!modelLoaded) {
                        cargarModeloIFC();
                    }
                }, 100);
            }
        };

        /* =========================================================
           INICIALIZACIÓN DE THREE.JS
           ========================================================= */
        function init3DViewer() {
            const container = document.getElementById('ifc-canvas-container');
            if (!container || container.clientWidth === 0) return;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100000);
            camera.position.set(50, 50, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight1.position.set(100, 200, 100);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight2.position.set(-100, 100, -100);
            scene.add(dirLight2);

            const gridHelper = new THREE.GridHelper(200, 20, 0x0284c7, 0x334155);
            scene.add(gridHelper);

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', ajustarTamanoRenderer);
            is3DInitialized = true;
        }

        function ajustarTamanoRenderer() {
            const container = document.getElementById('ifc-canvas-container');
            if (!container || !renderer || !camera) return;
            
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            if (width > 0 && height > 0) {
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            }
        }

        /* =========================================================
           CARGA Y PROCESAMIENTO DEL ARCHIVO IFC
           ========================================================= */
        async function cargarModeloIFC() {
            if (modelLoaded) return;

            const loadingBox = document.getElementById('ifc-loading-box');
            const errorBox = document.getElementById('ifc-error-box');
            const statusLabel = document.getElementById('ifc-status');

            try {
                if (loadingBox) loadingBox.style.display = 'block';
                if (errorBox) errorBox.style.display = 'none';

                ifcLoader = new IFCLoader();
                await ifcLoader.ifcManager.setWasmPath(URL_WASM);

                ifcLoader.load(
                    URL_IFC,
                    (ifcModel) => {
                        currentModel = ifcModel;
                        scene.add(ifcModel);
                        modelLoaded = true;

                        encuadrarModelo(ifcModel);

                        if (loadingBox) loadingBox.style.display = 'none';
                        if (statusLabel) {
                            statusLabel.textContent = '✅ Modelo cargado';
                            statusLabel.style.color = '#38bdf8';
                        }
                        
                        document.getElementById('ifc-info').innerHTML = `
                            <p style="color:#38bdf8; font-weight:bold;">Modelo IFC Cargado</p>
                            <p style="font-size:12px; color:#94a3b8; margin-top:4px;">Edificio 30 Aulas Hunza</p>
                        `;
                    },
                    (progress) => {
                        if (progress.lengthComputable) {
                            const percent = Math.round((progress.loaded / progress.total) * 100);
                            const loadingText = document.getElementById('loading-text');
                            if (loadingText) loadingText.textContent = `Cargando IFC... ${percent}%`;
                        }
                    },
                    (error) => {
                        console.error("Error al cargar IFC:", error);
                        if (loadingBox) loadingBox.style.display = 'none';
                        if (errorBox) {
                            errorBox.style.display = 'block';
                            errorBox.innerHTML = `<b>⚠️ Error:</b> No se pudo cargar el archivo IFC.<br><small>${error.message || error}</small>`;
                        }
                    }
                );
            } catch (err) {
                console.error("Error de inicialización IFC:", err);
                if (loadingBox) loadingBox.style.display = 'none';
            }
        }

        /* =========================================================
           ENCUADRE AUTOMÁTICO DE CÁMARA
           ========================================================= */
        function encuadrarModelo(object3D) {
            const box = new THREE.Box3().setFromObject(object3D);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2;

            camera.position.set(center.x + cameraZ, center.y + cameraZ, center.z + cameraZ);
            camera.lookAt(center);

            controls.target.copy(center);
            controls.update();
        }

        window.reencuadrarCamara = function() {
            if (currentModel) encuadrarModelo(currentModel);
        };

        window.cargarEdificio30 = function() {
            window.irAVista('vista-3d');
        };
    </script>
</body>
</html>
